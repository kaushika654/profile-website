<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="nav-logo" href="#hero">Your Name</a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#journey">Journey</a></li>
        <li><a href="#interests">Interests</a></li>
        <li><a href="#family">Family</a></li>
        <li><a href="#hobbies">Hobbies</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="hero" class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <p class="hero-eyebrow">Hello, I'm</p>
          <h1 class="hero-title">Your Name</h1>
          <p class="hero-tagline">Your Role | Something You Love | Another Thing</p>
          <p class="hero-intro">Two or three sentences about who you are and what you do.</p>
          <a class="btn" href="#journey">Explore My Journey &rarr;</a>
        </div>
        <img class="hero-photo" src="images/hero/profile.jpg" alt="Portrait of Your Name" width="380" height="380">
      </div>
    </section>
    <section id="journey"></section>
    <section id="interests"></section>
    <section id="family"></section>
    <section id="hobbies"></section>
  </main>
  <footer id="footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
